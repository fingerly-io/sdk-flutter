// The Gradle module Flutter's plugin tooling picks up.
//
// It depends on the native SDK rather than vendoring a copy of it. That is the
// whole architecture in one line: `mobile/android` is the implementation, and
// this package is a binding to it, so a fix to a root check reaches Flutter
// apps by bumping one dependency rather than by porting the fix a second time.

group 'io.fingerly.sdk.flutter'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // Ahead of Fingerly's own repository, so that a contributor's local
        // build is found without that host having to answer.
        mavenLocal()
        // Where the native SDK, io.fingerly:fingerly, comes from.
        maven { url 'https://maven.fingerly.io' }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'io.fingerly.sdk.flutter'
    compileSdk 36

    defaultConfig {
        // Matches the native SDK's floor. Raising it here would exclude apps
        // the SDK itself supports, and lowering it would promise a platform the
        // code does not build for.
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

// AGP 9 compiles Kotlin directly. Applying the legacy Kotlin Gradle Plugin in
// a Flutter plugin now produces a deprecation warning and will be rejected by
// a future Flutter release.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // The SDK that does the collecting, from the repository added above.
    implementation 'io.fingerly:fingerly:0.1.0'
}
