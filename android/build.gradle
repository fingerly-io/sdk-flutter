// The Gradle module Flutter's plugin tooling picks up.
//
// It depends on the native SDK rather than vendoring a copy of it. That is the
// whole architecture in one line: `mobile/android` is the implementation, and
// this package is a binding to it, so a fix to a root check reaches Flutter
// apps by bumping one dependency rather than by porting the fix a second time.
// The iOS podspec beside it says the same thing about `mobile/ios`.

group 'io.badele.sdk.flutter'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // Used by contributors until io.badele:badele is published. Maven
        // Central remains ahead of it, so released applications resolve the
        // published artifact once it exists.
        mavenLocal()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'io.badele.sdk.flutter'
    compileSdk 36

    defaultConfig {
        // Matches the native SDK's floor. Raising it here would exclude apps
        // the SDK itself supports, and lowering it would promise a platform the
        // code does not build for.
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

// AGP 9 compiles Kotlin directly. Applying the legacy Kotlin Gradle Plugin in
// a Flutter plugin now produces a deprecation warning and will be rejected by
// a future Flutter release.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // The SDK that does the collecting.
    //
    // Not published yet — see the note in the package README. Until it is, an
    // app building this from the monorepo publishes the native SDK to its local
    // Maven repository first, as documented in the package README.
    implementation 'io.badele:badele:0.1.0'
}
